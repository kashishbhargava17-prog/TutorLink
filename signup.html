<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | TutorLink</title>

    <link rel="stylesheet" href="styles.css">

    <style>

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.13), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(34, 211, 238, 0.12), transparent 30%),
                #f8fafc;
        }

        .auth-page {
            min-height: calc(100vh - 82px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 26px;
            padding: 38px;
            box-shadow: 0 20px 55px rgba(15, 23, 42, 0.09);
        }

        .auth-top {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-badge {
            display: inline-block;
            background: rgba(91, 75, 255, 0.1);
            color: #5b4bff;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 15px;
        }

        .auth-top h1 {
            color: #0f172a;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .auth-top p {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #334155;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font: inherit;
            color: #0f172a;
            background: white;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #5b4bff;
            box-shadow: 0 0 0 3px rgba(91, 75, 255, 0.1);
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 13px;
            color: white;
            background: linear-gradient(135deg, #5b4bff, #8b5cf6);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-message {
            min-height: 22px;
            text-align: center;
            margin: 15px 0;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .auth-message.error {
            color: #dc2626;
        }

        .auth-message.success {
            color: #16a34a;
        }

        .auth-bottom {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .auth-bottom a {
            color: #5b4bff;
            font-weight: 700;
            text-decoration: none;
        }

        .prototype-note {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            background: #f8fafc;
            color: #64748b;
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 28px 22px;
            }
        }

    </style>

</head>


<body>

    <header class="navbar">

    <div class="nav-container">

        <a
            href="index.html"
            class="logo"
            aria-label="TutorLink home"
        >

            <div class="logo-icon">
                🎓
            </div>

            <div class="logo-text">

                <span class="logo-name">
                    TutorLink
                </span>

                <span class="logo-tagline">
                    LEARN • TEACH • CONNECT
                </span>

            </div>

        </a>


        <nav
            class="nav-links"
            aria-label="Main navigation"
        >

            <a
                href="index.html"
                class="active"
            >
                Home
            </a>

            <a href="learn.html">
                Learn
            </a>

            <a href="about.html">
                About
            </a>

        </nav>


        <div class="nav-actions">

            <a
                href="login.html"
                class="btn-login"
            >
                Log In
            </a>

            <a
                href="signup.html"
                class="btn-signup"
            >
                Sign Up
            </a>

        </div>

    </div>

</header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-top">

                <span class="auth-badge">
                    JOIN TUTORLINK
                </span>

                <h1>Create your account</h1>

                <p>
                    Start your learning or teaching journey.
                </p>

            </div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="you@example.com"
                        required>

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label for="signupRole">
                        I want to join as
                    </label>

                    <select id="signupRole" required>

                        <option value="">
                            Choose your role
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="tutor">
                            Tutor
                        </option>

                    </select>

                </div>


                <div
                    id="signupMessage"
                    class="auth-message">
                </div>


                <button
                    type="submit"
                    class="auth-submit">

                    Create Account

                </button>

            </form>


            <div class="auth-bottom">

                Already have an account?
                <a href="login.html">Log in</a>

            </div>


            <div class="prototype-note">

                Prototype notice: account information is stored locally
                in your browser for demonstration purposes.

            </div>

        </div>

    </main>


    <script src="app.js"></script>

</body>
</html>
