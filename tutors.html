<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find a Tutor | TutorLink</title>

    <link rel="stylesheet" href="styles.css?v=20260926">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-container">

            <!-- TutorLink Brand -->

            <a href="index.html" class="brand" aria-label="TutorLink home">

                <span class="brand-icon">T</span>

                <span class="brand-text">
                    TutorLink
                </span>

            </a>


            <!-- Navigation -->

            <nav class="nav-links">

                <a href="index.html">Home</a>

                <a href="learn.html">Learn</a>

                <a href="about.html">About</a>

            </nav>


            <!-- Login / Signup -->

            <div class="nav-actions">

                <a href="login.html" class="nav-login">
                    Log In
                </a>

                <a href="signup.html" class="nav-signup">
                    Sign Up
                </a>

            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <section class="tutors-page">

            <div class="tutors-header">

                <div>

                    <span class="section-badge">
                        FIND YOUR MATCH
                    </span>

                    <h1>
                        Learn from the right tutor.
                    </h1>

                    <p>
                        Explore trusted tutors, compare teaching styles,
                        check availability, and find someone who fits
                        the way you learn.
                    </p>

                </div>

            </div>


            <!-- ================= SEARCH ================= -->

            <div class="tutor-search-card">

                <div class="search-main">

                    <input
                        type="text"
                        id="tutorSearch"
                        placeholder="Search by tutor, subject or skill..."
                    >

                    <button
                        class="search-button"
                        id="searchTutorsButton"
                        type="button"
                    >
                        🔎 Search
                    </button>

                </div>


                <div class="tutor-filters">

                    <!-- SUBJECT -->

                    <select id="subjectFilter">

                        <option value="">
                            All Subjects
                        </option>

                        <option value="Mathematics">
                            Mathematics
                        </option>

                        <option value="Physics">
                            Physics
                        </option>

                        <option value="English">
                            English
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Economics">
                            Economics
                        </option>

                        <option value="Business Studies">
                            Business Studies
                        </option>

                        <option value="Hindi">
                            Hindi
                        </option>

                        <option value="Python">
                            Python
                        </option>

                        <option value="Accounting">
                            Accounting
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                    </select>


                    <!-- LEVEL -->

                    <select id="levelFilter">

                        <option value="">
                            All Levels
                        </option>

                        <option value="School">
                            School
                        </option>

                        <option value="College">
                            College
                        </option>

                    </select>


                    <!-- RATING -->

                    <select id="ratingFilter">

                        <option value="">
                            Any Rating
                        </option>

                        <option value="4.5">
                            4.5+ ⭐
                        </option>

                        <option value="4.8">
